name: Verify Market Intelligence

on:
  push:
    branches:
      - codex/market-intelligence-tonight
      - codex/market-intelligence-openai-weekend
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
